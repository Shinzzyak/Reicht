name: sync-upstream

# Keeps this repo a mirror of the upstream hub, with our patches re-applied on every
# upstream change. Two properties matter more than freshness:
#
#   * a failed sync never deletes anything — the build stages into a temp directory and
#     only swaps on a clean compile, so players keep the last good tree;
#   * upstream disappearing is just a failed sync. The committed files are the mirror.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the upstream commit is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau compiler
        run: |
          set -euo pipefail
          tag=$(curl -sSf https://api.github.com/repos/luau-lang/luau/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          curl -sSfL -o /tmp/luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${tag}/luau-ubuntu.zip"
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -oq /tmp/luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP"/luau/*
          "$RUNNER_TEMP/luau/luau-compile" --help > /dev/null
          echo "LUAU_COMPILE=$RUNNER_TEMP/luau/luau-compile" >> "$GITHUB_ENV"
          echo "luau ${tag} installed"

      - name: Pull upstream and rebuild
        id: build
        env:
          UPSTREAM_DIR: ${{ runner.temp }}/upstream
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p "$UPSTREAM_DIR"
          if bash sync/pull-upstream.sh 2>&1 | tee /tmp/sync.log; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Commit changes
        id: commit
        if: steps.build.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name  "reicht-sync"
          git config user.email "reicht-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream change"
            exit 0
          fi
          sha=$(cat .upstream-sha 2>/dev/null || echo unknown)
          git commit -m "sync upstream ${sha:0:12}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify what GitHub actually serves
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}"
          # Raw content is cached briefly; poll instead of assuming the push is live.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/live.lua -w '%{http_code}' --max-time 30 "${base}/loader.lua")
            if [ "$code" = "200" ] && cmp -s /tmp/live.lua loader.lua; then
              echo "raw loader.lua matches the committed file"
              exit 0
            fi
            echo "attempt ${attempt}: raw not updated yet (http ${code})"
            sleep 10
          done
          echo "raw content never matched the commit" >&2
          exit 1

      - name: Report a failed sync
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/sync.log', 'utf8').slice(-4000); }
            catch (e) { log = '(no log captured)'; }
            const title = 'Upstream sync failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync',
            });
            const body = [
              'The scheduled sync did not complete. The served tree is unchanged, so the',
              'hub keeps working on the last good build.',
              '',
              '```',
              log,
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['sync'],
              });
            }
